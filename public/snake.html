<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    color: #000;
    font-family: monospace;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { margin: 0 0 8px; font-size: 20px; }
  #score { margin-bottom: 8px; }
  canvas {
    background: #fff;
    border: 2px solid #000;
    image-rendering: pixelated;
    touch-action: none;
    max-width: 95vw;
    max-height: 70vh;
  }
  #hint { margin-top: 8px; font-size: 12px; text-align: center; padding: 0 8px; }
  #restart {
    margin-top: 8px;
    padding: 8px 16px;
    font-family: monospace;
    font-size: 14px;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    cursor: pointer;
  }
  #restart:active { background: #000; color: #fff; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">Score: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <button id="restart">Rejouer</button>
  <div id="hint">Clavier : flèches + Espace<br>Mobile : glisse le doigt sur le jeu</div>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const cell = 20;
  const cols = canvas.width / cell;
  const rows = canvas.height / cell;

  let snake, dir, nextDir, food, score, alive, tick;

  function reset() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    alive = true;
    placeFood();
    scoreEl.textContent = 'Score: 0';
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function step() {
    if (!alive) return;
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      alive = false;
      draw();
      return;
    }

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = 'Score: ' + score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#000';
    for (const s of snake) {
      ctx.fillRect(s.x * cell, s.y * cell, cell, cell);
    }

    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.strokeRect(food.x * cell + 3, food.y * cell + 3, cell - 6, cell - 6);

    if (!alive) {
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(0, canvas.height/2 - 30, canvas.width, 60);
      ctx.fillStyle = '#000';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
      ctx.font = '12px monospace';
      ctx.fillText('Espace pour rejouer', canvas.width/2, canvas.height/2 + 18);
    }
  }

  function turn(nx, ny) {
    if (nx === 1 && dir.x !== -1) nextDir = {x: 1, y: 0};
    else if (nx === -1 && dir.x !== 1) nextDir = {x: -1, y: 0};
    else if (ny === 1 && dir.y !== -1) nextDir = {x: 0, y: 1};
    else if (ny === -1 && dir.y !== 1) nextDir = {x: 0, y: -1};
  }

  document.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowUp') turn(0, -1);
    else if (k === 'ArrowDown') turn(0, 1);
    else if (k === 'ArrowLeft') turn(-1, 0);
    else if (k === 'ArrowRight') turn(1, 0);
    else if (k === ' ' && !alive) reset();
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  });

  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive: false});
  canvas.addEventListener('touchmove', e => {
    if (!touchStart) return;
    e.preventDefault();
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    touchStart = {x: t.clientX, y: t.clientY};
  }, {passive: false});
  canvas.addEventListener('touchend', () => { touchStart = null; });

  document.getElementById('restart').addEventListener('click', () => {
    if (!alive) reset();
  });

  reset();
  setInterval(step, 100);
</script>
</body>
</html>
